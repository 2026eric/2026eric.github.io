<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異常回報表</title>

<style>
*{
    box-sizing:border-box;
    font-family:"Microsoft JhengHei",sans-serif;
}

body{
    margin:0;
    padding:30px;
    background:#f4f6f9;
}

.container{
    max-width:1400px;
    margin:auto;
    background:#ffffff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#005a9e;
    margin-bottom:30px;
}

h2{
    background:#005a9e;
    color:#ffffff;
    padding:12px;
    border-radius:5px;
    margin-top:30px;
}

/* 固定每行兩格 */
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px 25px;
    max-width:1000px;
    margin:0 auto;
}

.form-group{
    display:flex;
    flex-direction:column;
    position:relative;
    min-width:0;
}

.form-group > label{
    font-weight:bold;
    color:#222222;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #cccccc;
    border-radius:5px;
    font-size:14px;
    background:#ffffff;
    color:#222222;
}

/* 鎖定狀態 */
input:disabled{
    background:#eeeeee;
    color:#666666;
    cursor:not-allowed;
}

/* 日期標題 */
.date-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
}

.date-header > label{
    font-weight:bold;
    color:#222222;
    margin:0;
}

.date-check{
    display:flex;
    align-items:center;
    gap:5px;
    white-space:nowrap;
}

.date-check input{
    width:16px;
    height:16px;
    margin:0;
    cursor:pointer;
}

.date-check label{
    margin:0;
    font-size:13px;
    font-weight:normal;
    color:#005a9e;
    cursor:pointer;
}

/* 聯絡電話標題 */
.phone-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
}

.phone-header > label{
    font-weight:bold;
    color:#222222;
    margin:0;
}

/* 電話 / 手機選項 */
.phone-options{
    display:flex;
    align-items:center;
    gap:12px;
    white-space:nowrap;
}

.phone-options label{
    display:flex;
    align-items:center;
    gap:4px;
    margin:0;
    font-size:13px;
    font-weight:normal;
    cursor:pointer;
}

.phone-options input{
    width:auto;
    margin:0;
}

/* 異常說明 */
.report-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    max-width:1000px;
    margin:0 auto;
}

.report-box{
    background:#fafafa;
    border:1px solid #cccccc;
    border-radius:8px;
    padding:15px;
}

.report-box label{
    display:block;
    font-weight:bold;
    color:#222222;
    margin-bottom:10px;
}

.report-box textarea{
    width:100%;
    height:260px;
    resize:vertical;
}

/* 送出按鈕 */
.submit-area{
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.submit-btn{
    width:auto;
    min-width:130px;
    padding:11px 25px;
    border:none;
    border-radius:5px;
    font-size:16px;
    color:#ffffff;
    background:#28a745;
    cursor:pointer;
}

.submit-btn:hover{
    background:#218838;
}

.notice{
    text-align:center;
    color:#666666;
    margin-top:10px;
    font-size:13px;
}

/* 小螢幕 */
@media (max-width:768px){

    body{
        padding:15px;
    }

    .container{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .report-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>異常回報表</h1>

<h2>基本資料</h2>

<div class="form-grid">

    <!-- 第一列：日期 / 時間 -->
    <div class="form-group">

        <div class="date-header">

            <label for="abnormalDate">異常日期</label>

            <div class="date-check">

                <input
                    type="checkbox"
                    id="useCurrentDateTime"
                    onchange="setCurrentDateTime()">

                <label for="useCurrentDateTime">
                    帶入資料
                </label>

            </div>

        </div>

        <input
            type="text"
            id="abnormalDate"
            placeholder="例如：115/10/19">

    </div>


    <div class="form-group">

        <label for="abnormalTime">異常時間</label>

        <input
            type="text"
            id="abnormalTime"
            placeholder="例如：08:30">

    </div>


    <!-- 第二列：編號 / 員編 -->
    <div class="form-group">

        <label>編號</label>

        <input
            type="text"
            placeholder="請輸入編號">

    </div>


    <div class="form-group">

        <label>員編</label>

        <input
            type="text"
            placeholder="請輸入員編">

    </div>


    <!-- 第三列：姓名 / 分機 -->
    <div class="form-group">

        <label>姓名</label>

        <input
            type="text"
            placeholder="請輸入姓名">

    </div>


    <div class="form-group">

        <label>分機號碼</label>

        <input
            type="text"
            placeholder="請輸入分機號碼">

    </div>


    <!-- 第四列：聯絡電話 / Email -->
    <div class="form-group">

        <div class="phone-header">

            <label for="phoneNumber">
                聯絡電話
            </label>

            <div class="phone-options">

                <label>
                    <input
                        type="radio"
                        name="phoneType"
                        value="phone"
                        onchange="changePhoneType()">
                    電話
                </label>

                <label>
                    <input
                        type="radio"
                        name="phoneType"
                        value="mobile"
                        onchange="changePhoneType()">
                    手機
                </label>

            </div>

        </div>

        <input
            type="text"
            id="phoneNumber"
            placeholder="請先選擇電話或手機"
            disabled>

    </div>


    <div class="form-group">

        <label>電子郵件</label>

        <input
            type="text"
            placeholder="請輸入 Email">

    </div>


    <!-- 第五列：區域 / 部門 -->
    <div class="form-group">

        <label>區域</label>

        <select>
            <option value="">請選擇區域</option>
            <option value="康橋國際學校">
                康橋國際學校
            </option>
            <option value="康軒文教事業">
                康軒文教事業
            </option>
        </select>

    </div>


    <div class="form-group">

        <label>部門</label>

        <input
            type="text"
            placeholder="請輸入部門">

    </div>

</div>


<h2>異常說明</h2>

<div class="report-grid">

    <div class="report-box">

        <label>問題回報</label>

        <textarea
            placeholder="請詳細描述發現的問題、異常狀況、故障設備或需追蹤事項"></textarea>

    </div>


    <div class="report-box">

        <label>其他備註</label>

        <textarea
            placeholder="請填寫其他補充說明"></textarea>

    </div>

</div>


<div class="submit-area">

    <button
        class="submit-btn"
        type="button"
        onclick="fakeSubmit()">
        送出報表
    </button>

</div>


<div class="notice">
此按鈕僅供展示用途，不會實際送出任何資料
</div>

</div>


<script>

/* 帶入日期與時間 */
function setCurrentDateTime(){

    const checkbox =
        document.getElementById("useCurrentDateTime");

    const dateInput =
        document.getElementById("abnormalDate");

    const timeInput =
        document.getElementById("abnormalTime");


    /* 勾選：帶入資料並鎖定 */
    if(checkbox.checked){

        const now = new Date();

        const rocYear =
            now.getFullYear() - 1911;

        const month =
            String(now.getMonth() + 1).padStart(2, "0");

        const day =
            String(now.getDate()).padStart(2, "0");

        const hours =
            String(now.getHours()).padStart(2, "0");

        const minutes =
            String(now.getMinutes()).padStart(2, "0");


        dateInput.value =
            rocYear + "/" + month + "/" + day;

        timeInput.value =
            hours + ":" + minutes;


        dateInput.disabled = true;
        timeInput.disabled = true;

    }

    /* 取消勾選：清空並解除鎖定 */
    else{

        dateInput.disabled = false;
        timeInput.disabled = false;

        dateInput.value = "";
        timeInput.value = "";

        dateInput.placeholder =
            "例如：115/10/19";

        timeInput.placeholder =
            "例如：08:30";

    }
}


/* 電話 / 手機切換 */
function changePhoneType(){

    const selected =
        document.querySelector(
            'input[name="phoneType"\]:checked'
        );

    const phoneInput =
        document.getElementById("phoneNumber");


    /* 預防沒有任何選項 */
    if(!selected){

        phoneInput.value = "";
        phoneInput.disabled = true;
        phoneInput.placeholder =
            "請先選擇電話或手機";

        return;
    }


    /* 有選擇後解除鎖定 */
    phoneInput.disabled = false;

    if(selected.value === "phone"){

        phoneInput.placeholder =
            "請輸入電話號碼";

    }

    else if(selected.value === "mobile"){

        phoneInput.placeholder =
            "請輸入手機號碼";

    }
}


/* 展示用按鈕 */
function fakeSubmit(){

    alert(
        "異常回報表已送出"
    );

}

</script>

</body>
</html>
